services:
  - type: web
    name: 60sec-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://60sec.pcmdk369.com,https://60sec-mu.vercel.app,https://60sec-pcmdk-369-s-projects.vercel.app,https://60sec-git-main-pcmdk-369-s-projects.vercel.app
      - key: ADMIN_USERNAME
        value: Admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: WHISPER_MODEL
        value: base
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: VIDEO_WORKERS
        value: "1"
