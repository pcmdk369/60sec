name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - name: Install FFmpeg and pytest for end-to-end test
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install pytest
      - name: Run authenticated video-to-ZIP end-to-end test
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests
      - name: Smoke-test FastAPI app import and routes
        env:
          PYTHONPATH: backend
        run: python -c "from app.main import app; paths = {route.path for route in app.routes}; required = {'/health', '/api/auth/login', '/api/auth/session', '/api/jobs', '/api/jobs/{job_id}', '/api/jobs/{job_id}/download'}; assert required.issubset(paths), {'missing': sorted(required - paths), 'available': sorted(paths)}; print('FastAPI import, admin session, and background job routes OK')"
