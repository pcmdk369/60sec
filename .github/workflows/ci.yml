name: CI

on:
  push:
    branches: [main, feature/windows-local-six-language]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - name: Smoke-test FastAPI app import and routes
        env:
          PYTHONPATH: backend
        run: python -c "from app.main import app, health, _password_matches; paths = {route.path for route in app.routes}; assert '/health' in paths and '/api/auth/login' in paths and '/api/auth/session' in paths and '/api/jobs' in paths and '/api/jobs/{job_id}' in paths and '/api/jobs/{job_id}/download' in paths, paths; status = health(); assert status['caption_languages'] == ['original', 'english', 'hindi', 'spanish', 'chinese', 'thai', 'indonesian']; import hashlib; salt = b'1234567890abcdef'; rounds = 310000; digest = hashlib.pbkdf2_hmac('sha256', b'LocalTestPassword123', salt, rounds).hex(); assert _password_matches('LocalTestPassword123', 'pbkdf2_sha256' + chr(36) + str(rounds) + chr(36) + salt.hex() + chr(36) + digest); print('FastAPI routes, seven caption modes and PBKDF2 admin password verification OK')"

  windows-setup-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Windows setup script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/setup-windows.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "Windows setup script syntax is valid."
