name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - name: Smoke-test FastAPI app import and routes
        env:
          PYTHONPATH: backend
        run: python -c "from app.main import app; paths = {route.path for route in app.routes}; assert '/health' in paths and '/api/shorts' in paths, paths; print('FastAPI import and required routes OK')"
