name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests
      - name: Test authentication and API access
        env:
          PYTHONPATH: backend
          ADMIN_USERNAME: Admin
          SESSION_SECRET: ci-test-session-secret-at-least-32-bytes
        run: python -m pytest backend/tests -q
